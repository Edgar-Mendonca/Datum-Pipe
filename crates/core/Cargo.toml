[package]
name = "datum-core"
version = "0.2.1"
license = "MIT"
edition = "2021"
description = "Datum Pipe engine: the piping model and its edits, the pipe library, the 3D pipe element solver, load cases, code checks, isometrics and the verification benchmarks."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Sparse Cholesky (MIT), https://github.com/sarah-quinones/faer-rs
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
